<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign in — Web Attack Monitor</title>
  <link rel="stylesheet" href="/app.css" />
</head>
<body class="login-page">
  <main class="login-card">
    <div class="brand">
      <span class="mark" aria-hidden="true"></span>
      <div>
        <div class="name">GPEWebDefender</div>
        <div class="tag" id="login-tag">operator sign-in</div>
      </div>
    </div>
    <p class="field-help" id="login-help">Sign in with the operator username you created in Settings. This page is the login — there is no separate browser popup. The ingest token cannot open the dashboard.</p>
    <form id="login-form">
      <div class="field">
        <label for="user">Username</label>
        <input id="user" name="username" autocomplete="username" maxlength="32" required />
      </div>
      <div class="field">
        <label for="pass">Password</label>
        <input id="pass" name="password" type="password" autocomplete="current-password" required />
      </div>
      <div class="field" id="pass2-wrap" hidden>
        <label for="pass2">Confirm password</label>
        <input id="pass2" type="password" autocomplete="new-password" />
      </div>
      <p class="field-help" id="setup-hint" hidden>At least 12 characters. Do not reuse the ingest token or a site password.</p>
      <div class="settings-actions">
        <button type="submit" id="login-go">Sign in</button>
        <span class="muted" id="login-status"></span>
      </div>
    </form>
  </main>
  <script>
    const $ = (s) => document.querySelector(s);
    let setup = false;
    (async () => {
      try {
        const r = await fetch("/api/auth-status", { credentials: "same-origin" });
        const d = await r.json();
        setup = !!d.setup;
      } catch (_) {}
      if (setup) {
        document.title = "Create admin — Web Attack Monitor";
        $("#login-tag").textContent = "create the first admin";
        $("#login-help").textContent = "No operator accounts yet. This first user is an admin. After this, the dashboard requires a session — the ingest token will not open it.";
        $("#pass").autocomplete = "new-password";
        $("#pass2-wrap").hidden = false;
        $("#setup-hint").hidden = false;
        $("#login-go").textContent = "Create admin";
      }
    })();
    $("#login-form").addEventListener("submit", async (ev) => {
      ev.preventDefault();
      const status = $("#login-status");
      const username = $("#user").value.trim();
      const password = $("#pass").value;
      if (setup) {
        if (password !== $("#pass2").value) {
          status.textContent = "passwords do not match";
          return;
        }
      }
      status.textContent = "…";
      try {
        const r = await fetch(setup ? "/api/setup" : "/api/login", {
          method: "POST",
          credentials: "same-origin",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username, password }),
        });
        const text = await r.text();
        if (!r.ok) throw new Error(text.trim() || r.statusText);
        location.href = "/";
      } catch (err) {
        status.textContent = err.message || "failed";
      }
    });
  </script>
</body>
</html>
