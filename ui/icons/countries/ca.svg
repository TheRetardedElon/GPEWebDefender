<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="500" height="400">
  <defs>
    <!-- The neon cyber glow filter -->
    <filter id="caPreciseStaticGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <!-- The dot-grid pattern to match your GoPastEarth map aesthetic -->
    <pattern id="caPreciseStaticGrid" x="0" y="0" width="4" height="4" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.5" fill="#00ff66" opacity="0.4" />
    </pattern>
  </defs>

  <g filter="url(#caPreciseStaticGlow)">
    <!-- Mainland Canada -->
    <path d="M 60,330 L 120,332 L 180,335 L 240,338 L 270,340 L 280,350 L 300,360 L 310,345 L 330,340 L 350,330 L 360,345 L 380,340 L 390,320 L 370,290 L 360,260 L 370,230 L 340,200 L 310,210 L 300,240 L 310,270 L 290,290 L 260,280 L 240,250 L 250,220 L 230,190 L 200,170 L 170,165 L 140,150 L 110,160 L 80,170 L 75,230 L 60,260 L 70,280 L 55,310 Z" 
          fill="url(#caPreciseStaticGrid)" 
          stroke="#00ff66" 
          stroke-width="1.2" 
          stroke-linejoin="round" />
          
    <!-- Baffin Island (East Arctic) -->
    <path d="M 330,110 L 360,105 L 380,130 L 390,160 L 370,180 L 350,190 L 340,170 L 320,150 Z" 
          fill="url(#caPreciseStaticGrid)" 
          stroke="#00ff66" 
          stroke-width="1.2" 
          stroke-linejoin="round" />

    <!-- Victoria Island (Central Arctic) -->
    <path d="M 180,110 L 210,100 L 230,120 L 240,140 L 220,150 L 190,140 Z" 
          fill="url(#caPreciseStaticGrid)" 
          stroke="#00ff66" 
          stroke-width="1.2" 
          stroke-linejoin="round" />

    <!-- Ellesmere Island (Far North) -->
    <path d="M 280,30 L 310,25 L 330,50 L 320,80 L 290,90 L 270,70 Z" 
          fill="url(#caPreciseStaticGrid)" 
          stroke="#00ff66" 
          stroke-width="1.2" 
          stroke-linejoin="round" />

    <!-- Newfoundland (East Coast) -->
    <path d="M 400,290 L 420,280 L 440,300 L 430,320 L 410,310 Z" 
          fill="url(#caPreciseStaticGrid)" 
          stroke="#00ff66" 
          stroke-width="1.2" 
          stroke-linejoin="round" />
  </g>
</svg>