<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <!-- The neon cyber glow filter -->
    <filter id="doPreciseStaticGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <!-- The dot-grid pattern to match your GoPastEarth map aesthetic -->
    <pattern id="doPreciseStaticGrid" x="0" y="0" width="4" height="4" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.5" fill="#00ff66" opacity="0.4" />
    </pattern>
  </defs>

  <g filter="url(#doPreciseStaticGlow)">
    <!-- Main Dominican Republic Landmass (High-Fidelity Trace of image_1238de.png) -->
    <path d="M 50,40 L 70,35 L 90,45 L 110,40 L 130,50 L 150,55 L 170,50 L 190,60 L 210,65 L 230,105 L 245,100 L 255,105 L 250,115 L 220,110 L 215,120 L 225,125 L 250,125 L 280,120 L 300,125 L 320,135 L 340,150 L 350,170 L 330,185 L 320,180 L 310,190 L 280,185 L 260,180 L 240,185 L 220,175 L 210,185 L 205,200 L 195,195 L 175,200 L 160,190 L 140,205 L 120,240 L 105,270 L 95,260 L 90,240 L 80,210 L 70,185 L 50,175 L 45,160 L 60,150 L 55,135 L 45,140 L 35,135 L 45,120 L 35,100 L 50,85 Z" 
          fill="url(#doPreciseStaticGrid)" 
          stroke="#00ff66" 
          stroke-width="1.2" 
          stroke-linejoin="round" />
          
    <!-- Saona Island (Bottom Right) -->
    <path d="M 330,200 L 340,205 L 345,200 L 335,195 Z" 
          fill="url(#doPreciseStaticGrid)" 
          stroke="#00ff66" 
          stroke-width="1" />
          
    <!-- Beata Island (Bottom Left) -->
    <path d="M 85,280 L 95,275 L 90,285 Z" 
          fill="url(#doPreciseStaticGrid)" 
          stroke="#00ff66" 
          stroke-width="1" />
  </g>
</svg>