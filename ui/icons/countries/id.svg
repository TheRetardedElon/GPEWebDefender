<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 350" width="400" height="350">
  <defs>
    <!-- The neon cyber glow filter -->
    <filter id="adPreciseStaticGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <!-- The dot-grid pattern to match your GoPastEarth map aesthetic -->
    <pattern id="adPreciseStaticGrid" x="0" y="0" width="4" height="4" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.5" fill="#00ff66" opacity="0.4" />
    </pattern>
  </defs>

  <g filter="url(#adPreciseStaticGlow)">
    <!-- Andorra Landmass Outline -->
    <path d="M 90,10 L 115,25 L 120,40 L 135,35 L 160,40 L 185,50 L 210,45 L 240,55 L 255,75 L 275,65 L 290,90 L 305,120 L 330,130 L 360,135 L 380,145 L 365,160 L 345,155 L 340,185 L 325,200 L 315,225 L 335,245 L 310,265 L 295,290 L 265,285 L 240,310 L 210,320 L 180,340 L 160,335 L 140,345 L 125,335 L 90,340 L 80,320 L 45,325 L 50,295 L 30,295 L 20,285 L 50,275 L 45,245 L 65,230 L 70,200 L 40,195 L 15,190 L 25,165 L 50,150 L 55,130 L 85,100 L 75,70 L 90,40 Z" 
          fill="url(#adPreciseStaticGrid)" 
          stroke="#00ff66" 
          stroke-width="1.5" 
          stroke-linejoin="round" />
          
    <!-- Internal Parish Borders (Faint Network Traces) -->
    <path d="M 120,40 L 150,70 L 140,100 L 160,130 L 175,145 M 175,145 L 195,140 L 190,170 L 205,185 L 215,175 L 235,195 M 205,185 L 190,205 L 160,225 L 145,255 L 150,285 M 145,255 L 110,250 L 90,235 L 65,230 M 235,195 L 250,190 L 270,205 L 295,215 L 315,225 M 275,65 L 265,95 L 255,140 L 230,155 L 215,175" 
          fill="none" 
          stroke="#00ff66" 
          stroke-width="0.75" 
          stroke-dasharray="3 3" 
          stroke-opacity="0.6" />
  </g>
</svg>