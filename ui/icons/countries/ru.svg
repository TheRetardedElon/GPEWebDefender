<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="100%">
  <defs>
    <!-- The neon cyber glow filter -->
    <filter id="ruPreciseStaticGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <!-- The dot-grid pattern to match your GoPastEarth SIEM map aesthetic -->
    <pattern id="ruPreciseStaticGrid" x="0" y="0" width="4" height="4" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.5" fill="#00ff66" opacity="0.4" />
    </pattern>
  </defs>

  <g filter="url(#ruPreciseStaticGlow)">
    <!-- Main Russian Landmass (High-Fidelity Trace of image_124c27.png) -->
    <path d="M 60,180 L 80,160 L 75,140 L 90,135 L 110,145 L 120,130 L 130,135 L 125,160 L 140,170 L 160,150 L 180,160 L 190,140 L 210,145 L 220,120 L 240,130 L 235,160 L 250,165 L 260,145 L 280,150 L 290,120 L 320,110 L 350,115 L 370,80 L 390,70 L 410,75 L 430,100 L 450,110 L 470,105 L 500,120 L 530,125 L 550,115 L 570,125 L 580,110 L 610,115 L 630,125 L 660,120 L 690,130 L 710,125 L 730,140 L 750,145 L 770,160 L 790,175 L 780,195 L 760,185 L 750,210 L 720,200 L 730,180 L 690,190 L 670,210 L 640,225 L 610,220 L 590,240 L 570,245 L 560,280 L 540,290 L 510,320 L 490,325 L 475,300 L 460,270 L 450,265 L 430,280 L 410,275 L 380,260 L 360,275 L 340,280 L 320,270 L 290,280 L 260,260 L 240,270 L 220,265 L 200,280 L 180,275 L 160,300 L 140,310 L 130,330 L 110,320 L 100,290 L 80,285 L 60,260 L 50,255 L 65,240 L 55,220 L 45,210 L 50,190 Z" 
          fill="url(#ruPreciseStaticGrid)" 
          stroke="#00ff66" 
          stroke-width="1.2" 
          stroke-linejoin="round" />
          
    <!-- Kaliningrad Exclave (Far West) -->
    <path d="M 20,245 L 35,240 L 30,250 Z" fill="url(#ruPreciseStaticGrid)" stroke="#00ff66" stroke-width="1" />
    
    <!-- Novaya Zemlya (Curved Archipelago, Top Left-Center) -->
    <path d="M 180,100 L 195,85 L 215,65 L 225,50 L 210,55 L 195,80 Z" fill="url(#ruPreciseStaticGrid)" stroke="#00ff66" stroke-width="1.2" />
    <path d="M 175,110 L 185,105 L 180,115 Z" fill="url(#ruPreciseStaticGrid)" stroke="#00ff66" stroke-width="1" />
    
    <!-- Severnaya Zemlya (Top Center) -->
    <path d="M 350,40 L 370,30 L 380,45 L 360,50 Z" fill="url(#ruPreciseStaticGrid)" stroke="#00ff66" stroke-width="1" />
    <path d="M 385,55 L 400,60 L 390,65 Z" fill="url(#ruPreciseStaticGrid)" stroke="#00ff66" stroke-width="1" />
    
    <!-- New Siberian Islands (Top Right) -->
    <path d="M 520,75 L 540,70 L 550,85 L 530,90 Z" fill="url(#ruPreciseStaticGrid)" stroke="#00ff66" stroke-width="1" />
    <path d="M 560,80 L 575,85 L 565,95 Z" fill="url(#ruPreciseStaticGrid)" stroke="#00ff66" stroke-width="1" />
    
    <!-- Sakhalin Island (Bottom Right) -->
    <path d="M 640,250 L 645,245 L 655,280 L 645,310 L 635,305 L 645,275 Z" fill="url(#ruPreciseStaticGrid)" stroke="#00ff66" stroke-width="1.2" />
    
    <!-- Wrangel Island (Far North East) -->
    <path d="M 720,115 L 740,110 L 735,120 Z" fill="url(#ruPreciseStaticGrid)" stroke="#00ff66" stroke-width="1" />
  </g>
</svg>