<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 450" width="300" height="450">
  <defs>
    <!-- The neon cyber glow filter -->
    <filter id="iePreciseStaticGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <!-- The dot-grid pattern to match your GoPastEarth map aesthetic -->
    <pattern id="iePreciseStaticGrid" x="0" y="0" width="4" height="4" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.5" fill="#00ff66" opacity="0.4" />
    </pattern>
  </defs>

  <g filter="url(#iePreciseStaticGlow)">
    <!-- Main Ireland Landmass (High-Fidelity Trace of image_1240e1.png) -->
    <path d="M 125,125 L 140,115 L 155,135 L 175,130 L 180,140 L 200,145 L 195,155 L 210,160 L 215,180 L 235,185 L 245,210 L 235,225 L 240,240 L 250,250 L 245,265 L 255,280 L 245,305 L 250,325 L 225,330 L 215,325 L 210,340 L 185,340 L 175,355 L 150,360 L 140,375 L 125,370 L 115,385 L 105,380 L 95,395 L 85,380 L 70,390 L 60,370 L 80,365 L 65,355 L 50,360 L 45,345 L 65,340 L 60,325 L 90,320 L 80,305 L 105,295 L 95,280 L 115,275 L 100,265 L 125,255 L 100,245 L 80,245 L 105,235 L 75,225 L 70,210 L 100,205 L 65,195 L 75,185 L 60,180 L 90,165 L 85,150 L 105,145 L 95,130 Z" 
          fill="url(#iePreciseStaticGrid)" 
          stroke="#00ff66" 
          stroke-width="1.2" 
          stroke-linejoin="round" />
          
    <!-- Northern Segment (Matched to the separated silhouette artifact in your image) -->
    <path d="M 140,105 L 150,110 L 155,95 L 180,75 L 175,60 L 160,50 L 135,65 L 145,80 L 130,95 Z" 
          fill="url(#iePreciseStaticGrid)" 
          stroke="#00ff66" 
          stroke-width="1.2" 
          stroke-linejoin="round" />
          
    <!-- Small Western Coastal Islands -->
    <path d="M 50,135 L 55,130 L 60,140 Z" fill="url(#iePreciseStaticGrid)" stroke="#00ff66" stroke-width="1" />
    <path d="M 45,150 L 50,145 L 55,155 Z" fill="url(#iePreciseStaticGrid)" stroke="#00ff66" stroke-width="1" />
  </g>
</svg>