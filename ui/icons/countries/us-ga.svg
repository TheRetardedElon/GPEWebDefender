<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="200" height="200">
  <defs>
    <!-- The neon cyber glow filter -->
    <filter id="cityGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <!-- The dot-grid pattern to match your world map landmasses -->
    <pattern id="cityGrid" x="0" y="0" width="4" height="4" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.5" fill="#00ff66" opacity="0.4" />
    </pattern>
  </defs>

  <g filter="url(#cityGlow)">
    <!-- Atlanta Municipal Boundary (Jagged Silhouette matched to your image) -->
    <path d="M 40,5 L 45,3 L 50,7 L 50,3 L 60,3 L 65,5 L 65,10 L 80,10 L 80,35 L 75,35 L 75,42 L 85,42 L 85,50 L 95,50 L 95,56 L 80,56 L 80,60 L 85,60 L 80,65 L 75,60 L 75,85 L 60,85 L 60,80 L 58,80 L 58,75 L 53,75 L 53,70 L 48,70 L 48,88 L 40,88 L 40,80 L 35,80 L 35,70 L 38,70 L 38,65 L 25,65 L 25,70 L 22,70 L 22,86 L 12,86 L 12,68 L 10,68 L 10,62 L 15,62 L 15,58 L 22,58 L 22,55 L 15,55 L 15,48 L 25,48 L 25,45 L 20,45 L 20,40 L 28,40 L 32,32 L 35,25 L 40,20 Z" 
          fill="url(#cityGrid)" 
          stroke="#00ff66" 
          stroke-width="0.75" 
          stroke-linejoin="round" />
          
    <!-- Optional: A glowing target node for Downtown Atlanta inside the map -->
    <circle cx="50" cy="45" r="1.5" fill="#00ff66" />
    <circle cx="50" cy="45" r="3" fill="none" stroke="#00ff66" stroke-width="0.5" stroke-dasharray="1 1" />
  </g>
</svg>