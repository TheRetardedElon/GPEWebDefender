<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="500" height="400">
  <defs>
    <!-- The neon cyber glow filter -->
    <filter id="mxPreciseStaticGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <!-- The dot-grid pattern to match your GoPastEarth map aesthetic -->
    <pattern id="mxPreciseStaticGrid" x="0" y="0" width="4" height="4" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.5" fill="#00ff66" opacity="0.4" />
    </pattern>
  </defs>

  <g filter="url(#mxPreciseStaticGlow)">
    <!-- Mexico Mainland (Baja California, Sonora, Yucatan, etc.) -->
    <path d="M 60,60 L 80,75 L 70,110 L 95,140 L 120,135 L 140,160 L 160,150 L 180,180 L 210,190 L 240,210 L 270,220 L 300,250 L 330,280 L 350,260 L 330,240 L 310,230 L 320,210 L 300,195 L 280,185 L 260,160 L 240,140 L 220,120 L 200,105 L 170,90 L 150,75 L 120,60 L 90,55 Z" 
          fill="url(#mxPreciseStaticGrid)" 
          stroke="#00ff66" 
          stroke-width="1.2" 
          stroke-linejoin="round" />
          
    <!-- Baja California Peninsula -->
    <path d="M 45,70 L 60,85 L 50,130 L 40,160 L 35,150 L 42,110 Z" 
          fill="url(#mxPreciseStaticGrid)" 
          stroke="#00ff66" 
          stroke-width="1.2" 
          stroke-linejoin="round" />
          
    <!-- Yucatan Peninsula Extension -->
    <path d="M 350,260 L 380,245 L 395,260 L 370,285 L 350,275 Z" 
          fill="url(#mxPreciseStaticGrid)" 
          stroke="#00ff66" 
          stroke-width="1.2" 
          stroke-linejoin="round" />
  </g>
</svg>