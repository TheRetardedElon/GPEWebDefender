<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" width="400" height="280">
  <defs>
    <!-- The neon cyber glow filter -->
    <filter id="chPreciseStaticGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <!-- The dot-grid pattern to match your GoPastEarth map aesthetic -->
    <pattern id="chPreciseStaticGrid" x="0" y="0" width="4" height="4" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.5" fill="#00ff66" opacity="0.4" />
    </pattern>
  </defs>

  <g filter="url(#chPreciseStaticGlow)">
    <!-- Main Switzerland Landmass (High-Fidelity Trace of image_123cbd.png) -->
    <path d="M 30,180 L 40,170 L 45,150 L 35,135 L 50,130 L 60,100 L 80,80 L 100,50 L 120,60 L 130,45 L 160,40 L 180,50 L 220,40 L 240,25 L 255,30 L 260,15 L 280,20 L 300,30 L 320,35 L 350,55 L 360,75 L 340,90 L 360,110 L 380,115 L 390,140 L 375,155 L 380,180 L 360,175 L 340,195 L 320,185 L 300,210 L 310,230 L 290,255 L 270,245 L 260,220 L 240,210 L 220,230 L 200,200 L 180,190 L 160,210 L 140,230 L 120,240 L 100,220 L 95,195 L 80,180 L 60,185 L 45,190 Z" 
          fill="url(#chPreciseStaticGrid)" 
          stroke="#00ff66" 
          stroke-width="1.2" 
          stroke-linejoin="round" />
          
    <!-- Small detached northern fragment (Schaffhausen area detail from silhouette) -->
    <path d="M 270,10 L 280,5 L 285,15 L 275,18 Z" 
          fill="url(#chPreciseStaticGrid)" 
          stroke="#00ff66" 
          stroke-width="1" />
  </g>
</svg>