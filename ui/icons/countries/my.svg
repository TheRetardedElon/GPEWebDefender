<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="400" height="200">
  <defs>
    <!-- The neon cyber glow filter -->
    <filter id="myPreciseStaticGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <!-- The dot-grid pattern to match your GoPastEarth map aesthetic -->
    <pattern id="myPreciseStaticGrid" x="0" y="0" width="4" height="4" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.5" fill="#00ff66" opacity="0.4" />
    </pattern>
  </defs>

  <g filter="url(#myPreciseStaticGlow)">
    <!-- Peninsular Malaysia (West) -->
    <path d="M 65,85 L 75,90 L 70,100 L 80,105 L 85,120 L 95,135 L 105,145 L 115,150 L 125,160 L 130,155 L 125,145 L 135,140 L 125,125 L 115,110 L 110,95 L 95,85 L 85,80 Z" 
          fill="url(#myPreciseStaticGrid)" 
          stroke="#00ff66" 
          stroke-width="1.2" 
          stroke-linejoin="round" />
          
    <!-- Small Islands (Langkawi/Penang area) -->
    <path d="M 55,85 L 60,88 L 58,92 Z" fill="url(#myPreciseStaticGrid)" stroke="#00ff66" stroke-width="1" />

    <!-- East Malaysia (Sabah and Sarawak on Borneo) -->
    <path d="M 215,150 L 225,160 L 235,155 L 245,160 L 255,155 L 270,160 L 285,155 L 300,150 L 315,145 L 330,135 L 345,135 L 360,125 L 370,115 L 355,110 L 365,100 L 350,95 L 340,105 L 335,90 L 325,95 L 315,105 L 305,100 L 295,95 L 285,110 L 275,115 L 265,130 L 255,125 L 245,140 Z" 
          fill="url(#myPreciseStaticGrid)" 
          stroke="#00ff66" 
          stroke-width="1.2" 
          stroke-linejoin="round" />
          
    <!-- Northern Islands (Banggi area) -->
    <path d="M 335,80 L 340,75 L 342,85 Z" fill="url(#myPreciseStaticGrid)" stroke="#00ff66" stroke-width="1" />
  </g>
</svg>