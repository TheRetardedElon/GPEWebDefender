<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 350" width="350" height="350">
  <defs>
    <!-- The neon cyber glow filter -->
    <filter id="lrPreciseStaticGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <!-- The dot-grid pattern to match your GoPastEarth map aesthetic -->
    <pattern id="lrPreciseStaticGrid" x="0" y="0" width="4" height="4" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.5" fill="#00ff66" opacity="0.4" />
    </pattern>
  </defs>

  <g filter="url(#lrPreciseStaticGlow)">
    <!-- Main Liberia Landmass (High-Fidelity Trace of image_1244a4.png) -->
    <path d="M 25,125 L 35,115 L 35,105 L 45,95 L 55,95 L 65,85 L 80,75 L 90,80 L 105,65 L 120,40 L 125,25 L 140,20 L 150,25 L 160,20 L 165,35 L 170,50 L 165,65 L 170,75 L 175,80 L 195,85 L 205,95 L 210,85 L 220,70 L 235,75 L 245,85 L 255,110 L 245,120 L 250,135 L 260,140 L 270,150 L 265,165 L 285,175 L 295,180 L 290,195 L 305,205 L 310,215 L 325,215 L 320,235 L 330,240 L 325,260 L 330,270 L 320,285 L 325,305 L 315,315 L 300,315 L 280,305 L 260,295 L 235,275 L 210,255 L 180,230 L 160,210 L 140,195 L 120,180 L 100,180 L 90,165 L 75,150 L 55,135 L 40,125 Z" 
          fill="url(#lrPreciseStaticGrid)" 
          stroke="#00ff66" 
          stroke-width="1.2" 
          stroke-linejoin="round" />
          
    <!-- Small coastal inlet detail (Bottom Left) -->
    <path d="M 40,140 L 50,145 L 45,150 Z" 
          fill="url(#lrPreciseStaticGrid)" 
          stroke="#00ff66" 
          stroke-width="1" />
  </g>
</svg>