<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <defs>
    <!-- The neon cyber glow filter -->
    <filter id="dePreciseStaticGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <!-- The dot-grid pattern to match your GoPastEarth map aesthetic -->
    <pattern id="dePreciseStaticGrid" x="0" y="0" width="4" height="4" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.5" fill="#00ff66" opacity="0.4" />
    </pattern>
  </defs>

  <g filter="url(#dePreciseStaticGlow)">
    <!-- Germany Landmass (High-Fidelity Trace of image_12a601.png) -->
    <path d="M 130,20 L 140,25 L 135,35 L 145,40 L 155,30 L 165,35 L 175,30 L 185,45 L 205,40 L 215,50 L 220,65 L 235,70 L 230,85 L 235,100 L 225,115 L 230,130 L 240,140 L 245,155 L 235,170 L 240,185 L 220,200 L 210,195 L 195,215 L 180,210 L 175,230 L 160,235 L 150,255 L 135,245 L 120,250 L 115,240 L 100,245 L 85,250 L 80,235 L 90,220 L 80,205 L 95,190 L 85,180 L 65,185 L 55,170 L 65,155 L 50,140 L 60,125 L 55,110 L 70,100 L 65,85 L 85,80 L 75,65 L 90,55 L 85,45 L 100,45 L 110,35 Z" 
          fill="url(#dePreciseStaticGrid)" 
          stroke="#00ff66" 
          stroke-width="1.2" 
          stroke-linejoin="round" />
          
    <!-- Rügen and Northern Islands -->
    <path d="M 190,30 L 200,25 L 195,35 Z" fill="url(#dePreciseStaticGrid)" stroke="#00ff66" stroke-width="1" />
    <path d="M 115,15 L 125,10 L 120,20 Z" fill="url(#dePreciseStaticGrid)" stroke="#00ff66" stroke-width="1" />
  </g>
</svg>