<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="200" height="200">
  <defs>
    <!-- The neon cyber glow filter -->
    <filter id="ilGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <!-- The dot-grid pattern to match your world map landmasses -->
    <pattern id="ilGrid" x="0" y="0" width="4" height="4" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.5" fill="#00ff66" opacity="0.4" />
    </pattern>

    <style>
      .chi-pulse {
        transform-origin: 72px 18px;
        animation: ping-chi 2s ease-out infinite;
      }
      @keyframes ping-chi {
        0% { transform: scale(1); opacity: 0.8; }
        100% { transform: scale(3); opacity: 0; stroke-width: 0.5; }
      }
    </style>
  </defs>

  <g filter="url(#ilGlow)">
    <!-- Illinois State Boundary (Matched to your uploaded image) -->
    <path d="M 30,5 L 70,5 L 70,10 L 76,25 L 77,55 L 75,58 L 78,63 L 74,68 L 76,75 L 72,82 L 68,85 L 68,90 L 62,88 L 56,95 L 53,92 L 54,88 L 48,82 L 45,75 L 48,68 L 40,60 L 30,55 L 25,45 L 28,35 L 30,28 L 35,25 L 38,18 L 32,12 Z" 
          fill="url(#ilGrid)" 
          stroke="#00ff66" 
          stroke-width="0.75" 
          stroke-linejoin="round" />
          
    <!-- Chicago Target Node (Top Right by Lake Michigan) -->
    <circle cx="72" cy="18" r="1.5" fill="#00ff66" />
    <circle class="chi-pulse" cx="72" cy="18" r="3" fill="none" stroke="#00ff66" stroke-width="0.75" />
    
    <!-- Minor Infrastructure Lines (Connecting Chicago to downstate) -->
    <path d="M 72,18 L 50,45 L 45,75 M 50,45 L 30,55 M 72,18 L 70,50" 
          fill="none" 
          stroke="#00ff66" 
          stroke-width="0.5" 
          stroke-dasharray="2 2" 
          stroke-opacity="0.6" />
  </g>
</svg>