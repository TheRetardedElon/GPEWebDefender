<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" width="300" height="200">
  <defs>
    <!-- The neon cyber glow filter -->
    <filter id="sgPreciseStaticGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <!-- The dot-grid pattern to match your GoPastEarth map aesthetic -->
    <pattern id="sgPreciseStaticGrid" x="0" y="0" width="4" height="4" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.5" fill="#00ff66" opacity="0.4" />
    </pattern>
  </defs>

  <g filter="url(#sgPreciseStaticGlow)">
    <!-- Singapore Main Island & Offshore Landmass -->
    <path d="M 60,110 L 80,85 L 110,75 L 140,70 L 170,75 L 200,85 L 225,100 L 235,120 L 220,135 L 190,140 L 160,145 L 130,140 L 100,135 L 75,125 Z" 
          fill="url(#sgPreciseStaticGrid)" 
          stroke="#00ff66" 
          stroke-width="1.2" 
          stroke-linejoin="round" />
          
    <!-- Jurong Island (Western Extension) -->
    <path d="M 45,115 L 55,110 L 52,122 L 40,120 Z" 
          fill="url(#sgPreciseStaticGrid)" 
          stroke="#00ff66" 
          stroke-width="1" />
          
    <!-- Pulau Tekong (Eastern Island) -->
    <path d="M 245,105 L 255,100 L 260,112 L 248,115 Z" 
          fill="url(#sgPreciseStaticGrid)" 
          stroke="#00ff66" 
          stroke-width="1" />
  </g>
</svg>