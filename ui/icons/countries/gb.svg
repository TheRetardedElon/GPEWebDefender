<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 450" width="350" height="450">
  <defs>
    <!-- The neon cyber glow filter -->
    <filter id="ukPreciseStaticGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <!-- The dot-grid pattern to match your GoPastEarth map aesthetic -->
    <pattern id="ukPreciseStaticGrid" x="0" y="0" width="4" height="4" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.5" fill="#00ff66" opacity="0.4" />
    </pattern>
  </defs>

  <g filter="url(#ukPreciseStaticGlow)">
    <!-- Great Britain Mainland (England, Scotland, Wales) -->
    <path d="M 175,40 L 190,55 L 180,80 L 195,90 L 185,115 L 210,130 L 220,160 L 210,190 L 235,210 L 250,240 L 240,270 L 260,300 L 245,330 L 225,350 L 210,380 L 185,410 L 165,390 L 175,360 L 160,340 L 140,350 L 125,330 L 140,310 L 130,280 L 150,260 L 140,230 L 120,225 L 110,240 L 95,220 L 105,190 L 90,175 L 100,150 L 115,140 L 110,110 L 130,95 L 145,100 L 160,75 Z" 
          fill="url(#ukPreciseStaticGrid)" 
          stroke="#00ff66" 
          stroke-width="1.2" 
          stroke-linejoin="round" />
          
    <!-- Northern Ireland -->
    <path d="M 80,180 L 95,175 L 100,190 L 85,200 Z" 
          fill="url(#ukPreciseStaticGrid)" 
          stroke="#00ff66" 
          stroke-width="1.2" 
          stroke-linejoin="round" />
  </g>
</svg>