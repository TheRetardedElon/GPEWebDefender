<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <!-- The neon cyber glow filter -->
    <filter id="egPreciseStaticGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <!-- The dot-grid pattern to match your GoPastEarth map aesthetic -->
    <pattern id="egPreciseStaticGrid" x="0" y="0" width="4" height="4" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.5" fill="#00ff66" opacity="0.4" />
    </pattern>
  </defs>

  <g filter="url(#egPreciseStaticGlow)">
    <!-- Main Egypt Landmass & Sinai Peninsula -->
    <path d="M 80,80 
             L 80,140 L 82,200 L 78,260 L 80,320 
             L 140,318 L 200,322 L 280,320 
             L 275,300 L 265,270 L 250,240 L 235,210 L 220,175 L 210,150 
             L 225,165 L 240,195 
             L 255,160 L 270,130 L 280,115 
             L 270,100 L 260,85 L 250,80 
             L 230,85 L 210,95 L 190,85 L 170,80 L 140,85 L 110,75 L 80,80 Z" 
          fill="url(#egPreciseStaticGrid)" 
          stroke="#00ff66" 
          stroke-width="1.2" 
          stroke-linejoin="round" />
  </g>
</svg>