<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 250" width="200" height="250">
  <defs>
    <!-- The neon cyber glow filter -->
    <filter id="nlPreciseStaticGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <!-- The dot-grid pattern to match your GoPastEarth world map -->
    <pattern id="nlPreciseStaticGrid" x="0" y="0" width="4" height="4" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.5" fill="#00ff66" opacity="0.4" />
    </pattern>
  </defs>

  <g filter="url(#nlPreciseStaticGlow)">
    <!-- Main Netherlands Landmass (High-Fidelity Trace of image_1cae29.png) -->
    <path d="M 115,40 L 135,30 L 150,30 L 155,40 L 165,45 L 160,60 L 175,70 L 170,90 L 185,100 L 190,115 L 180,130 L 165,140 L 160,155 L 145,160 L 140,175 L 130,180 L 135,200 L 145,210 L 135,220 L 140,235 L 130,245 L 120,235 L 125,220 L 115,205 L 105,200 L 95,205 L 90,195 L 75,190 L 60,190 L 50,185 L 40,175 L 50,170 L 60,170 L 55,155 L 70,150 L 65,135 L 75,125 L 80,105 L 85,75 L 95,65 L 100,85 L 110,80 L 105,55 L 115,40 Z" 
          fill="url(#nlPreciseStaticGrid)" 
          stroke="#00ff66" 
          stroke-width="1.2" 
          stroke-linejoin="round" />
          
    <!-- Zeeland Delta Islands (Southwest) -->
    <path d="M 30,175 L 40,170 L 45,175 L 35,180 Z" fill="url(#nlPreciseStaticGrid)" stroke="#00ff66" stroke-width="1" />
    <path d="M 25,165 L 35,160 L 40,165 L 30,170 Z" fill="url(#nlPreciseStaticGrid)" stroke="#00ff66" stroke-width="1" />
    <path d="M 40,155 L 50,150 L 55,155 L 45,160 Z" fill="url(#nlPreciseStaticGrid)" stroke="#00ff66" stroke-width="1" />

    <!-- Wadden Islands (North) -->
    <path d="M 80,50 L 90,45 L 85,50 Z" fill="url(#nlPreciseStaticGrid)" stroke="#00ff66" stroke-width="1" />
    <path d="M 95,40 L 110,35 L 105,40 Z" fill="url(#nlPreciseStaticGrid)" stroke="#00ff66" stroke-width="1" />
    <path d="M 115,30 L 130,25 L 125,30 Z" fill="url(#nlPreciseStaticGrid)" stroke="#00ff66" stroke-width="1" />
  </g>
</svg>