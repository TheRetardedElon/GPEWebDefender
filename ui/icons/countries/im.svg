<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 350" width="250" height="350">
  <defs>
    <!-- The neon cyber glow filter -->
    <filter id="iomPreciseStaticGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <!-- The dot-grid pattern to match your GoPastEarth map aesthetic -->
    <pattern id="iomPreciseStaticGrid" x="0" y="0" width="4" height="4" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.5" fill="#00ff66" opacity="0.4" />
    </pattern>
  </defs>

  <g filter="url(#iomPreciseStaticGlow)">
    <!-- Isle of Man Landmass (High-Fidelity Trace of image_f5faf8.png) -->
    <path d="M 120,40 L 140,55 L 155,90 L 165,120 L 160,150 L 150,180 L 135,210 L 120,240 L 105,270 L 90,290 L 80,310 L 70,320 L 60,310 L 75,290 L 85,270 L 95,240 L 100,210 L 105,180 L 100,150 L 90,120 L 95,90 L 105,60 Z" 
          fill="url(#iomPreciseStaticGrid)" 
          stroke="#00ff66" 
          stroke-width="1.2" 
          stroke-linejoin="round" />
          
    <!-- Calf of Man (Small Island at Southern Tip) -->
    <path d="M 55,325 L 62,320 L 65,330 L 58,335 Z" 
          fill="url(#iomPreciseStaticGrid)" 
          stroke="#00ff66" 
          stroke-width="1" />
  </g>
</svg>