<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <defs>
    <!-- The neon cyber glow filter -->
    <filter id="hkPreciseStaticGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <!-- The dot-grid pattern to match your GoPastEarth map aesthetic -->
    <pattern id="hkPreciseStaticGrid" x="0" y="0" width="4" height="4" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.5" fill="#00ff66" opacity="0.4" />
    </pattern>
  </defs>

  <g filter="url(#hkPreciseStaticGlow)">
    <!-- New Territories & Kowloon Mainland -->
    <path d="M 60,60 L 90,50 L 120,55 L 150,45 L 180,60 L 210,80 L 230,110 L 215,140 L 190,160 L 160,150 L 140,170 L 110,160 L 90,140 L 105,120 L 80,100 L 65,80 Z" 
          fill="url(#hkPreciseStaticGrid)" 
          stroke="#00ff66" 
          stroke-width="1.2" 
          stroke-linejoin="round" />
          
    <!-- Hong Kong Island -->
    <path d="M 110,190 L 140,185 L 175,195 L 160,215 L 120,210 Z" 
          fill="url(#hkPreciseStaticGrid)" 
          stroke="#00ff66" 
          stroke-width="1.2" 
          stroke-linejoin="round" />
          
    <!-- Lantau Island (West) -->
    <path d="M 40,150 L 70,140 L 85,165 L 70,190 L 45,180 Z" 
          fill="url(#hkPreciseStaticGrid)" 
          stroke="#00ff66" 
          stroke-width="1.2" 
          stroke-linejoin="round" />
  </g>
</svg>