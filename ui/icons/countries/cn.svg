<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 250" width="300" height="250">
  <defs>
    <!-- The neon cyber glow filter -->
    <filter id="cnPreciseStaticGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <!-- The dot-grid pattern to match your GoPastEarth world map -->
    <pattern id="cnPreciseStaticGrid" x="0" y="0" width="4" height="4" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.5" fill="#00ff66" opacity="0.4" />
    </pattern>
  </defs>

  <g filter="url(#cnPreciseStaticGlow)">
    <!-- Mainland China (High-Fidelity Trace of Adobe Stock image_1cb8c8.png) -->
    <path d="M 210,40 L 225,48 L 220,55 L 250,60 L 260,50 L 270,55 L 280,50 L 285,60 L 290,75 L 280,85 L 270,80 L 260,90 L 275,95 L 285,100 L 270,110 L 260,120 L 280,125 L 270,135 L 280,145 L 260,165 L 245,170 L 230,175 L 220,185 L 210,180 L 200,170 L 195,180 L 180,175 L 170,185 L 160,170 L 140,175 L 130,165 L 110,165 L 100,175 L 90,160 L 80,165 L 60,150 L 45,150 L 30,140 L 25,120 L 10,110 L 20,100 L 35,105 L 25,90 L 40,85 L 55,95 L 60,80 L 80,80 L 90,95 L 105,90 L 115,85 L 130,95 L 145,95 L 150,105 L 165,95 L 175,100 L 190,80 L 195,65 L 185,55 Z" 
          fill="url(#cnPreciseStaticGrid)" 
          stroke="#00ff66" 
          stroke-width="1.2" 
          stroke-linejoin="round" />
          
    <!-- Hainan Island (Matched to the bottom cluster) -->
    <path d="M 215,195 L 225,200 L 220,210 L 210,205 Z" 
          fill="url(#cnPreciseStaticGrid)" 
          stroke="#00ff66" 
          stroke-width="1.2" 
          stroke-linejoin="round" />
  </g>
</svg>