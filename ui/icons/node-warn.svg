<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <filter id="glowAmber" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Outer Hexagon -->
  <polygon points="50,10 84.6,30 84.6,70 50,90 15.4,70 15.4,30" fill="none" stroke="#ffcc00" stroke-width="1.5" filter="url(#glowAmber)"/>
  <!-- Inner Core -->
  <polygon points="50,30 67.3,40 67.3,60 50,70 32.7,60 32.7,40" fill="#ffcc00" fill-opacity="0.6" filter="url(#glowAmber)"/>
  <!-- Circuit Traces -->
  <path d="M50,10 L50,30 M84.6,30 L67.3,40 M84.6,70 L67.3,60 M50,90 L50,70 M15.4,70 L32.7,60 M15.4,30 L32.7,40" stroke="#ffcc00" stroke-width="1" filter="url(#glowAmber)"/>
</svg>
