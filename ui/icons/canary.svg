<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <filter id="canaryGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <linearGradient id="canaryGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00ff88" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#00ff88" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <g filter="url(#canaryGlow)" stroke="#00ff88" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round" fill="url(#canaryGrad)">
    <!-- Beak & Head Facets -->
    <polygon points="50,14 45,23 55,23" fill="#00ff88" fill-opacity="0.6"/>
    <polygon points="50,14 40,22 50,30 60,22" />
    
    <!-- Chest & Torso -->
    <polygon points="50,30 38,46 50,62 62,46" />
    
    <!-- Left Wing (Faceted) -->
    <polygon points="40,22 18,18 32,35" />
    <polygon points="18,18 4,28 22,42 32,35" />
    <polygon points="4,28 10,48 28,50 22,42" />
    <polygon points="32,35 28,50 38,46" />
    
    <!-- Right Wing (Faceted) -->
    <polygon points="60,22 82,18 68,35" />
    <polygon points="82,18 96,28 78,42 68,35" />
    <polygon points="96,28 90,48 72,50 78,42" />
    <polygon points="68,35 72,50 62,46" />
    
    <!-- Flanks & Tail -->
    <polygon points="38,46 50,62 42,75 32,58" />
    <polygon points="62,46 50,62 58,75 68,58" />
    <polygon points="50,62 45,86 50,92 55,86" />
    <polygon points="42,75 36,86 45,86 50,62" />
    <polygon points="58,75 64,86 55,86 50,62" />
  </g>

  <!-- Glowing Tech Nodes & Data Core -->
  <polygon points="50,38 44,46 50,54 56,46" fill="#00ff88" fill-opacity="0.9" filter="url(#canaryGlow)"/>
  <circle cx="4" cy="28" r="1.5" fill="#00ff88"/>
  <circle cx="96" cy="28" r="1.5" fill="#00ff88"/>
  <circle cx="50" cy="92" r="1.5" fill="#00ff88"/>
</svg>
