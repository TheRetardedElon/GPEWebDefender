<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <g fill="none" stroke="#00ff66" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <!-- Background Grid Substrate -->
    <rect x="20" y="20" width="60" height="60" rx="4" stroke-opacity="0.3" />
    <line x1="20" y1="40" x2="80" y2="40" stroke-opacity="0.3" />
    <line x1="20" y1="60" x2="80" y2="60" stroke-opacity="0.3" />
    <line x1="40" y1="20" x2="40" y2="80" stroke-opacity="0.3" />
    <line x1="60" y1="20" x2="60" y2="80" stroke-opacity="0.3" />
    <!-- Active Scanner Laser -->
    <line x1="10" y1="45" x2="90" y2="45" stroke-width="6" style="filter: drop-shadow(0px 2px 4px #00ff66);" />
    <!-- Discovered Node Blip -->
    <circle cx="60" cy="60" r="5" fill="#00ff66" />
  </g>
