<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <g fill="none" stroke="#00ff66" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <!-- Canary Sensor Node (Diamond shape for the 'coal mine canary' feel) -->
    <polygon points="50,40 65,60 50,80 35,60" fill="#00ff66" fill-opacity="0.15" stroke-width="3"/>
    <circle cx="50" cy="60" r="4" fill="#00ff66" />
    
    <!-- Active Tripwire -->
    <line x1="10" y1="60" x2="30" y2="60" stroke-dasharray="5 5" stroke-width="3" />
    <line x1="70" y1="60" x2="90" y2="60" stroke-dasharray="5 5" stroke-width="3" />
    
    <!-- Sonar / Alert Emission -->
    <path d="M 30,35 Q 50,10 70,35" stroke-width="4" />
    <path d="M 20,20 Q 50,-10 80,20" stroke-width="3" stroke-opacity="0.5" />
  </g>
</svg>