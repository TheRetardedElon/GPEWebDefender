<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <filter id="linuxAuthGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <g filter="url(#linuxAuthGlow)" fill="none" stroke="#00ff66" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <!-- Security Shield Outer Base -->
    <path d="M 50,12 L 85,25 V 50 C 85,72 50,88 50,88 C 50,88 15,72 15,50 V 25 Z" />
    
    <!-- Terminal Prompt Chevron & Underscore (>_) inside Shield -->
    <path d="M 32,38 L 44,48 L 32,58" stroke-width="3.5" />
    <line x1="49" y1="58" x2="62" y2="58" stroke-width="3.5" />
    
    <!-- Authentication Keyhole Core (Bottom of Shield) -->
    <circle cx="50" cy="42" r="3" fill="#00ff66" stroke="none" />
    <path d="M 48,44 L 46,54 H 54 L 52,44 Z" stroke="none" fill="#00ff66" />
  </g>
</svg>