<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <filter id="cloudStaticGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <pattern id="cloudStaticGrid" x="0" y="0" width="4" height="4" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.5" fill="#00ff66" opacity="0.4" />
    </pattern>
  </defs>

  <g filter="url(#cloudStaticGlow)">
    <!-- Low-Poly Cloud Outline -->
    <path d="M 60,120 L 40,100 L 50,70 L 70,60 L 90,35 L 120,40 L 140,55 L 165,70 L 160,100 L 140,120 Z" 
          fill="url(#cloudStaticGrid)" 
          stroke="#00ff66" 
          stroke-width="1.2" 
          stroke-linejoin="round" />
          
    <!-- Internal Geometric Facets -->
    <polyline points="40,100 90,90 120,40" fill="none" stroke="#00ff66" stroke-width="0.75" />
    <polyline points="70,60 90,90 140,55" fill="none" stroke="#00ff66" stroke-width="0.75" />
    <polyline points="90,90 140,120" fill="none" stroke="#00ff66" stroke-width="0.75" />
    <polyline points="90,90 160,100" fill="none" stroke="#00ff66" stroke-width="0.75" />
    
    <!-- Active Cloud Nodes -->
    <circle cx="90" cy="90" r="3" fill="#00ff66" />
    <circle cx="140" cy="55" r="2.5" fill="#00ff66" />
    <circle cx="50" cy="70" r="2.5" fill="#00ff66" />
    <circle cx="160" cy="100" r="2.5" fill="#00ff66" />
    
    <!-- Outbound Connections -->
    <path d="M 90,120 L 90,150 M 60,130 L 70,160 M 120,130 L 110,160" 
          fill="none" 
          stroke="#00ff66" 
          stroke-width="1" 
          stroke-dasharray="3 3" />
  </g>
</svg>