<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <filter id="dbStaticGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <pattern id="dbStaticGrid" x="0" y="0" width="4" height="4" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.5" fill="#00ff66" opacity="0.4" />
    </pattern>
  </defs>

  <g filter="url(#dbStaticGlow)">
    <!-- Hexagonal Database Top Face -->
    <polygon points="100,30 150,55 100,80 50,55" 
             fill="url(#dbStaticGrid)" 
             stroke="#00ff66" 
             stroke-width="1.2" 
             stroke-linejoin="round" />
             
    <!-- Left Face -->
    <polygon points="50,55 100,80 100,170 50,145" 
             fill="url(#dbStaticGrid)" 
             stroke="#00ff66" 
             stroke-width="1.2" 
             stroke-linejoin="round" />
             
    <!-- Right Face -->
    <polygon points="100,80 150,55 150,145 100,170" 
             fill="url(#dbStaticGrid)" 
             stroke="#00ff66" 
             stroke-width="1.2" 
             stroke-linejoin="round" />

    <!-- Drive Array Separation Lines (Isometric) -->
    <polyline points="50,85 100,110 150,85" fill="none" stroke="#00ff66" stroke-width="1.2" />
    <polyline points="50,115 100,140 150,115" fill="none" stroke="#00ff66" stroke-width="1.2" />

    <!-- Status Lights (Right Face) -->
    <polygon points="115,75 120,72.5 120,76.5 115,79" fill="#00ff66" />
    <polygon points="115,105 120,102.5 120,106.5 115,109" fill="#00ff66" />
    <polygon points="115,135 120,132.5 120,136.5 115,139" fill="#00ff66" />

    <!-- Core Memory Ring on Top Face -->
    <ellipse cx="100" cy="55" rx="15" ry="7" fill="none" stroke="#00ff66" stroke-width="1" />
    <circle cx="100" cy="55" r="3" fill="#00ff66" />
  </g>
</svg>