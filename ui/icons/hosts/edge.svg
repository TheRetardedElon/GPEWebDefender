<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <filter id="fwStaticGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <pattern id="fwStaticGrid" x="0" y="0" width="4" height="4" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.5" fill="#00ff66" opacity="0.4" />
    </pattern>
  </defs>

  <g filter="url(#fwStaticGlow)">
    <!-- Monolithic Edge Gateway (Front Left Face) -->
    <polygon points="40,80 100,110 100,180 40,150" fill="url(#fwStaticGrid)" stroke="#00ff66" stroke-width="1.2" stroke-linejoin="round" />
    <!-- Monolithic Edge Gateway (Front Right Face) -->
    <polygon points="100,110 160,80 160,150 100,180" fill="url(#fwStaticGrid)" stroke="#00ff66" stroke-width="1.2" stroke-linejoin="round" />
    <!-- Monolithic Edge Gateway (Top Face) -->
    <polygon points="100,50 160,80 100,110 40,80" fill="url(#fwStaticGrid)" stroke="#00ff66" stroke-width="1.2" stroke-linejoin="round" />

    <!-- External Shielding Rings (WAF Barrier) -->
    <polyline points="20,70 100,110 180,70" fill="none" stroke="#00ff66" stroke-width="0.75" stroke-dasharray="4 2" />
    <polyline points="20,100 100,140 180,100" fill="none" stroke="#00ff66" stroke-width="0.75" stroke-dasharray="4 2" />
    
    <!-- Edge Uplink Antennas -->
    <line x1="60" y1="70" x2="60" y2="30" stroke="#00ff66" stroke-width="1.2" />
    <circle cx="60" cy="30" r="2.5" fill="#00ff66" />
    <line x1="140" y1="70" x2="140" y2="30" stroke="#00ff66" stroke-width="1.2" />
    <circle cx="140" cy="30" r="2.5" fill="#00ff66" />

    <!-- Core Security Node -->
    <polygon points="100,130 110,125 100,120 90,125" fill="#00ff66" />
    <circle cx="100" cy="125" r="8" fill="none" stroke="#00ff66" stroke-width="1" />
  </g>
</svg>