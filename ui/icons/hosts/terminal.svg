<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <filter id="posStaticGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <pattern id="posStaticGrid" x="0" y="0" width="4" height="4" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.5" fill="#00ff66" opacity="0.4" />
    </pattern>
  </defs>

  <g filter="url(#posStaticGlow)">
    <!-- Terminal Screen Panel -->
    <polygon points="40,50 140,30 140,110 40,130" fill="url(#posStaticGrid)" stroke="#00ff66" stroke-width="1.2" stroke-linejoin="round" />
    <!-- Terminal Back Casing -->
    <polygon points="140,30 160,40 160,120 140,110" fill="url(#posStaticGrid)" stroke="#00ff66" stroke-width="1.2" stroke-linejoin="round" />
    <polygon points="40,130 140,110 160,120 60,140" fill="url(#posStaticGrid)" stroke="#00ff66" stroke-width="1.2" stroke-linejoin="round" />
    
    <!-- Screen Inner Bezel -->
    <polygon points="50,55 130,39 130,101 50,117" fill="none" stroke="#00ff66" stroke-width="0.75" />
    
    <!-- Screen Data Lines (Telemetry Graph) -->
    <polyline points="60,105 75,90 90,95 120,60" fill="none" stroke="#00ff66" stroke-width="1.5" stroke-linejoin="round" />
    <circle cx="120" cy="60" r="2.5" fill="#00ff66" />

    <!-- Terminal Stand Base -->
    <polygon points="70,160 120,150 130,160 80,170" fill="url(#posStaticGrid)" stroke="#00ff66" stroke-width="1.2" stroke-linejoin="round" />
    <!-- Terminal Stand Neck -->
    <polygon points="90,135 110,131 110,152 90,156" fill="none" stroke="#00ff66" stroke-width="1" stroke-linejoin="round" />
  </g>
</svg>