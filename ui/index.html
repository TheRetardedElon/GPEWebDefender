<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GPEWebDefender — Web Attack Monitor</title>
  <link rel="stylesheet" href="/app.css" />
</head>
<body>
  <header class="top">
    <div class="brand">
      <span class="mark" aria-hidden="true"></span>
      <div>
        <div class="name">GPEWebDefender</div>
        <div class="tag">what's hitting the site</div>
      </div>
    </div>
    <div class="live">
      <label class="host-pick">
        <span>Hosts</span>
        <select id="host" aria-label="Filter by host">
          <option value="">All hosts</option>
        </select>
      </label>
      <a class="docs-link" href="/docs/">Docs</a>
      <span class="dot" id="live-dot"></span>
      <span id="live-label">connecting</span>
    </div>
  </header>

  <nav class="tabs" id="view-tabs" aria-label="Views">
    <button type="button" data-view="live" class="on">Live</button>
    <button type="button" data-view="reports">Reports</button>
  </nav>

  <div id="view-live">
  <section class="stats" id="stats"></section>

  <section class="map-wrap">
    <div class="map-panel">
      <header>
        <h2>Live attack map</h2>
        <span class="muted" id="map-meta">waiting for geo…</span>
      </header>
      <canvas id="map" width="1200" height="420" aria-label="World attack map"></canvas>
      <div class="map-key-row">
        <div class="map-key" id="map-key"></div>
      </div>
      <div class="map-legend" id="map-legend"></div>
    </div>
  </section>

  <section class="toolbar">
    <input id="q" type="search" placeholder="Search IP, path, rule…" autocomplete="off" />
    <div class="filters" id="filters">
      <button data-sev="all" class="on">All</button>
      <button data-sev="critical">Critical</button>
      <button data-sev="high">High</button>
      <button data-sev="medium">Medium</button>
      <button data-sev="low">Low</button>
    </div>
  </section>

  <main class="grid">
    <section class="panel feed">
      <header>
        <h2>Live alerts</h2>
        <span class="muted" id="feed-meta"></span>
      </header>
      <div id="alerts" class="list"></div>
    </section>
    <aside class="side">
      <section class="panel">
        <header><h2>Attackers</h2></header>
        <div id="attackers" class="list compact"></div>
      </section>
      <section class="panel">
        <header><h2>HTTP mix / 1h</h2></header>
        <div id="status" class="bars"></div>
      </section>
      <section class="panel">
        <header><h2>Last hour</h2></header>
        <div id="cats" class="bars"></div>
      </section>
    </aside>
  </main>
  </div>

  <div id="view-reports" hidden>
    <div class="report-bar">
      <div class="filters" id="report-views">
        <button type="button" data-report="vectors" class="on">Attack vectors</button>
        <button type="button" data-report="web">Auth · Web</button>
        <button type="button" data-report="linux">Auth · Linux</button>
        <button type="button" data-report="app">Auth · App</button>
      </div>
      <div class="filters" id="report-range">
        <button type="button" data-range="1h">1h</button>
        <button type="button" data-range="24h" class="on">24h</button>
        <button type="button" data-range="168h">7d</button>
      </div>
    </div>
    <section class="stats" id="report-stats"></section>
    <div class="report-grid" id="report-body"></div>
  </div>

  <dialog id="detail">
    <article></article>
    <form method="dialog"><button>Close</button></form>
  </dialog>

  <script src="/app.js"></script>
</body>
</html>
